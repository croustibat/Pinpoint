name: Pinpoint
options:
  bundleIdPrefix: app.croustibat
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  Pinpoint:
    type: application
    platform: macOS
    sources:
      - Pinpoint
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      # The `pinpoint` CLI (#56) ships *inside* the app, at
      # Pinpoint.app/Contents/Helpers/pinpoint. Not a separate download: it has
      # to be signed with the app and notarized with it, and the Homebrew cask
      # symlinks it from there. Listed as a dependency so `xcodebuild -scheme
      # Pinpoint` — which is all CI runs — builds and embeds it too.
      #
      # Helpers/ rather than MacOS/: macOS filesystems are case-insensitive, so
      # `pinpoint` and the app's own `Pinpoint` executable are the *same name*
      # in that directory — the copy silently overwrites the app binary and the
      # bundle no longer launches. Helpers/ is also where a bundled command-line
      # tool belongs; MacOS/ is for the main executable.
      - target: PinpointCLI
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Pinpoint/Info.plist
      properties:
        CFBundleDisplayName: Pinpoint
        CFBundleName: Pinpoint
        # Version comes from the build settings below. Must be declared here,
        # otherwise `xcodegen generate` rewrites Info.plist with its defaults
        # (CFBundleShortVersionString=1.0 / CFBundleVersion=1) on every run.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Menu-bar only app: no Dock icon, no main window.
        LSUIElement: true
        # Deep links (#58). Declared here rather than in Info.plist, which
        # `xcodegen generate` rewrites — same reason as the version keys above.
        # What each URL may ask for, and what it deliberately cannot, is in
        # Pinpoint/URLCommand.swift.
        CFBundleURLTypes:
          - CFBundleURLName: app.croustibat.Pinpoint.deeplink
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - pinpoint
        NSHumanReadableCopyright: "© 2026 Baptiste Bouillot"
        # Sparkle auto-update. The appcast is hosted on the landing site; the
        # public EdDSA key pairs with the private key held in the release
        # machine's keychain (used by scripts/update-appcast.sh to sign updates).
        SUFeedURL: https://pinpoint-ashy.vercel.app/appcast.xml
        SUPublicEDKey: "+9BFwjsyhynA3QpwOytwA3h1E7yy0OJH+R26Xbzkrsw="
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.croustibat.Pinpoint
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Stable signing identity so the TCC "Screen Recording" grant persists
        # across rebuilds. Without a team, Xcode ad-hoc-signs (cdhash changes
        # every build → macOS re-prompts each time). Baked in here so it
        # survives `xcodegen generate`.
        DEVELOPMENT_TEAM: MMJD6CLKNQ
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The scriptable entry point (#56): `pinpoint capture`, `pinpoint last`, and
  # the stdio MCP server (#57) at `pinpoint mcp` — a subcommand of this same
  # tool rather than a second binary, so there is nothing new to sign
  # individually in scripts/release.sh and scripts/install-local.sh, and
  # nothing new to embed in project.yml's `Pinpoint` target above. A command-
  # line tool, not a second app — it drives the running app through the
  # `pinpoint://` scheme above, because a bare executable has none of the
  # app's TCC grants and could never take the screenshot itself.
  PinpointCLI:
    type: tool
    platform: macOS
    sources:
      # Recurses into PinpointCLI/MCP/, which holds the JSON-RPC transport and
      # tool definitions for `pinpoint mcp` (#57).
      - PinpointCLI
      # The handoff contract, compiled into both binaries instead of restated
      # in the CLI: `pinpoint last` and `pinpoint mcp` read the very file the
      # app writes, and a second copy of the paths or of the schema is a
      # second thing to keep in step. A build error here is the point — it
      # fires the day the contract grows a dependency a file reader shouldn't
      # need.
      - path: Pinpoint/HandoffContract.swift
      - path: Pinpoint/HandoffDocument.swift
      # The deep-link vocabulary, for the same reason: the tool that fires
      # `pinpoint://capture` and the handler that reads it are one piece of code.
      - path: Pinpoint/URLCommand.swift
    settings:
      base:
        PRODUCT_NAME: pinpoint
        PRODUCT_BUNDLE_IDENTIFIER: app.croustibat.Pinpoint.cli
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "7"
        # A tool has no Info.plist of its own; this embeds one in the binary so
        # `pinpoint --version` can read the version it was built with.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MMJD6CLKNQ
        # Same hardened runtime as the app: it is embedded in that bundle, and
        # scripts/release.sh signs it individually before signing the app.
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # Never installed on its own — it rides in the app bundle.
        SKIP_INSTALL: YES
